server {
    listen 8000;
    server_name _;
    # Trusted catalogue/commit RPCs can contain hundreds of provider listings.
    # The public application's input limit remains 256k in web.conf and Express.
    client_max_body_size 8m;
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
