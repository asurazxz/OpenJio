<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF8F1" />
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('openjio:theme') } catch (e) {}
        if (['system', 'light', 'dark'].indexOf(t) === -1) t = 'light'
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme-choice', t)
        document.documentElement.setAttribute('data-bs-theme', d ? 'dark' : 'light')
        document.querySelector('meta[name="theme-color"]').content = d ? '#1C1917' : '#FFF8F1'
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
    <title>OpenJio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
