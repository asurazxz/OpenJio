name: openjio

services:
  setup:
    image: node:22.21.1-alpine3.22
    profiles: [tools]
    working_dir: /workspace
    volumes: [".:/workspace"]
    command: [node, scripts/setup-docker.mjs]

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXP: 3600
    volumes:
      - database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-openjio-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${APP_URL:-http://localhost:8080}/supabase/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-}@db:5432/postgres
      GOTRUE_SITE_URL: ${APP_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL:-http://localhost:8080}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      auth: {condition: service_healthy}
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: [/bin/sh, /migrate.sh]

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_JWT_SECRET: ${JWT_SECRET:-}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_MAX_ROWS: 1000
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 20

  supabase:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    depends_on:
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
    volumes:
      - ./docker/supabase.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8000/auth/v1/health]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    restart: unless-stopped
    depends_on:
      supabase: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      DATA_MODE: supabase
      SUPABASE_URL: http://supabase:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-}
      PORT: 8787
      TRUST_PROXY: 1
      ALLOWED_ORIGINS: ${APP_URL:-http://localhost:8080}
      PIPELINE_PYTHON: /opt/venv/bin/python
      INGEST_RUN_TOKEN: ${SERVICE_ROLE_KEY:-}
    volumes:
      - provider-cache:/app/server/.cache
      - pipeline-output:/app/pipeline/out
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    environment:
      SUPABASE_ANON_KEY: ${ANON_KEY:-}
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/config.json]
      interval: 5s
      timeout: 5s
      retries: 20

  import-data:
    image: node:22.21.1-alpine3.22
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - provider-cache:/target/cache
      - pipeline-output:/target/pipeline
    command: [node, scripts/import-live-data.mjs]

  smoke:
    image: node:22.21.1-alpine3.22
    profiles: [tools]
    working_dir: /workspace
    environment:
      OPENJIO_BASE_URL: http://web
      OPENJIO_ALLOW_REMOTE: "1"
      OPENJIO_TEST_ALLOW_WRITES: ${OPENJIO_TEST_ALLOW_WRITES:-}
    volumes: [".:/workspace:ro"]
    command: [node, scripts/test-hosted.mjs]

volumes:
  database:
  database-config:
  provider-cache:
  pipeline-output:
